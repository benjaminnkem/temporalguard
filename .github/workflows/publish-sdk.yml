name: Publish SDK

on:
  push:
    tags:
      # e.g. temporalguard-node-v0.1.1
      - "temporalguard-node-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish temporalguard-node to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Reads exact version from package.json "packageManager" (pnpm@9.0.0)
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        working-directory: packages/node
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          EXPECTED="temporalguard-node-v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "Tag '$TAG' must equal '$EXPECTED' (package.json version)."
            exit 1
          fi

      - name: Test and build SDK
        run: |
          pnpm --filter temporalguard-node test
          pnpm --filter temporalguard-node build

      - name: Publish to npm
        working-directory: packages/node
        run: |
          # prepublishOnly also builds/tests; publish with public access
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
