name: temporalguard
services:
  ingester:
    command:
      - /signoz-otel-collector migrate sync check && exec /signoz-otel-collector
        --config=/etc/otel-collector-config.yaml
    entrypoint:
      - /bin/sh
      - -c
    environment:
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN=tcp://temporalguard-signoz-telemetrystore-clickhouse-0-0:9000
      - SIGNOZ_OTEL_COLLECTOR_TIMEOUT=10m
    image: signoz/signoz-otel-collector:latest
    networks:
      temporalguard-signoz-network:
        aliases:
          - temporalguard-signoz-ingester
    ports:
      - 4317:4317
      - 4318:4318
    restart: unless-stopped
    volumes:
      - ./infra/foundry/generated/local/deployment/ingester/ingester.yaml:/etc/otel-collector-config.yaml:ro
      - ./infra/foundry/generated/local/deployment/ingester/opamp.yaml:/etc/opamp-config.yaml:ro
    depends_on:
      temporalguard-signoz-signoz-0:
        condition: service_healthy
      temporalguard-signoz-telemetrystore-migrator:
        condition: service_completed_successfully
  temporalguard-signoz-metastore-postgres-0:
    container_name: temporalguard-signoz-metastore-postgres-0
    environment:
      - POSTGRES_DB=signoz
      - POSTGRES_PASSWORD=signoz
      - POSTGRES_USER=signoz
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 30s
      test:
        - CMD-SHELL
        - pg_isready -U signoz -d signoz
      timeout: 10s
    image: postgres:16
    networks:
      - temporalguard-signoz-network
    restart: unless-stopped
    volumes:
      - temporalguard-signoz-metastore-postgres-0-data:/var/lib/postgresql/data
  temporalguard-signoz-signoz-0:
    container_name: temporalguard-signoz-signoz-0
    environment:
      - SIGNOZ_SQLSTORE_POSTGRES_DSN=postgres://signoz:signoz@temporalguard-signoz-metastore-postgres-0:5432/signoz?sslmode=disable
      - SIGNOZ_SQLSTORE_PROVIDER=postgres
      - SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN=tcp://temporalguard-signoz-telemetrystore-clickhouse-0-0:9000
      - SIGNOZ_TELEMETRYSTORE_PROVIDER=clickhouse
      - SIGNOZ_TOKENIZER_JWT_SECRET=${SIGNOZ_JWT_SECRET:-temporalguard-local-signoz-secret}
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 60s
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://localhost:8080/api/v1/health
      timeout: 10s
    image: signoz/signoz:latest
    networks:
      - temporalguard-signoz-network
    ports:
      - ${SIGNOZ_UI_PORT:-3301}:8080
    restart: unless-stopped
    depends_on:
      temporalguard-signoz-metastore-postgres-0:
        condition: service_healthy
      temporalguard-signoz-telemetrystore-clickhouse-0-0:
        condition: service_healthy
  temporalguard-signoz-telemetrykeeper-clickhousekeeper-0:
    container_name: temporalguard-signoz-telemetrykeeper-clickhousekeeper-0
    entrypoint:
      - /usr/bin/clickhouse-keeper
      - --config-file=/etc/clickhouse-keeper/keeper.yaml
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 40s
      test:
        - CMD
        - clickhouse-keeper-client
        - -h
        - localhost
        - -p
        - "9181"
        - -q
        - ls
      timeout: 10s
    image: clickhouse/clickhouse-keeper:25.12.5
    networks:
      - temporalguard-signoz-network
    restart: unless-stopped
    volumes:
      - temporalguard-signoz-telemetrykeeper-0-data:/var/lib/clickhouse-keeper
      - ./infra/foundry/generated/local/deployment/telemetrykeeper/clickhousekeeper/keeper-0.yaml:/etc/clickhouse-keeper/keeper.yaml:ro
  temporalguard-signoz-telemetrystore-clickhouse-0-0:
    container_name: temporalguard-signoz-telemetrystore-clickhouse-0-0
    depends_on:
      temporalguard-signoz-telemetrykeeper-clickhousekeeper-0:
        condition: service_healthy
      temporalguard-signoz-telemetrystore-clickhouse-user-scripts:
        condition: service_completed_successfully
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
      - CLICKHOUSE_CONFIG=/etc/clickhouse-server/config-0-0.yaml
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 40s
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://localhost:8123/ping
      timeout: 10s
    image: clickhouse/clickhouse-server:25.12.5
    networks:
      - temporalguard-signoz-network
    restart: unless-stopped
    volumes:
      - temporalguard-signoz-telemetrystore-0-0-data:/var/lib/clickhouse
      - temporalguard-signoz-telemetrystore-user-scripts:/var/lib/clickhouse/user_scripts:ro
      - ./infra/foundry/generated/local/deployment/telemetrystore/clickhouse/config-0-0.yaml:/etc/clickhouse-server/config-0-0.yaml:ro
      - ./infra/foundry/generated/local/deployment/telemetrystore/clickhouse/functions.yaml:/etc/clickhouse-server/functions.yaml:ro
  temporalguard-signoz-telemetrystore-clickhouse-user-scripts:
    command:
      - bash
      - -c
      - |-
        version="v0.0.1"
        node_os=$$(uname -s | tr '[:upper:]' '[:lower:]')
        node_arch=$$(uname -m | sed s/aarch64/arm64/ | sed s/x86_64/amd64/)
        echo "Fetching histogram-binary for $${node_os}/$${node_arch}"
        cd /tmp
        wget -O histogram-quantile.tar.gz "https://github.com/SigNoz/signoz/releases/download/histogram-quantile%2F$${version}/histogram-quantile_$${node_os}_$${node_arch}.tar.gz"
        tar -xvzf histogram-quantile.tar.gz
        mv histogram-quantile /var/lib/clickhouse/user_scripts/histogramQuantile
    container_name: temporalguard-signoz-telemetrystore-clickhouse-user-scripts
    image: clickhouse/clickhouse-server:25.12.5
    networks:
      - temporalguard-signoz-network
    restart: on-failure
    volumes:
      - temporalguard-signoz-telemetrystore-user-scripts:/var/lib/clickhouse/user_scripts
  temporalguard-signoz-telemetrystore-migrator:
    command:
      - -c
      - |
        /signoz-otel-collector migrate ready &&
        /signoz-otel-collector migrate bootstrap &&
        /signoz-otel-collector migrate sync up &&
        /signoz-otel-collector migrate async up
    container_name: temporalguard-signoz-telemetrystore-migrator
    entrypoint:
      - /bin/sh
    environment:
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN=tcp://temporalguard-signoz-telemetrystore-clickhouse-0-0:9000
      - SIGNOZ_OTEL_COLLECTOR_TIMEOUT=10m
    image: signoz/signoz-otel-collector:latest
    networks:
      - temporalguard-signoz-network
    restart: on-failure
  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8080
      WEB_ORIGIN: http://web:3000
      API_ORIGIN: http://api:3000
      SIGNOZ_PUBLIC_URL: ${SIGNOZ_PUBLIC_URL:-http://localhost:3301}
    ports:
      - ${GATEWAY_PORT:-8088}:8080
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - temporalguard-app
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://127.0.0.1:8080/healthz
      interval: 10s
      timeout: 5s
      retries: 12
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: /api
        NEXT_PUBLIC_DATA_MODE: ${NEXT_PUBLIC_DATA_MODE:-api}
        NEXT_PUBLIC_AUTH_MODE: ${NEXT_PUBLIC_AUTH_MODE:-api}
        NEXT_PUBLIC_SIGNOZ_UI_URL: ${NEXT_PUBLIC_SIGNOZ_UI_URL:-http://localhost:3301}
        NEXT_PUBLIC_DEFAULT_ENVIRONMENT: ${NEXT_PUBLIC_DEFAULT_ENVIRONMENT:-production}
        NEXT_PUBLIC_SIGNOZ_MODE: ${NEXT_PUBLIC_SIGNOZ_MODE:-self_hosted}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    expose:
      - "3000"
    networks:
      - temporalguard-app
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://127.0.0.1:3000/overview
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-temporalguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-temporalguard}
      POSTGRES_DB: ${POSTGRES_DB:-temporalguard}
    volumes:
      - temporalguard-postgres-data:/var/lib/postgresql/data
    networks:
      - temporalguard-app
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - yes
    volumes:
      - temporalguard-redis-data:/data
    networks:
      - temporalguard-app
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: no
    command:
      - node
      - node_modules/typeorm/cli.js
      - -d
      - dist/database/data-source.js
      - migration:run
    environment: &a1
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-temporalguard}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-temporalguard}
      DB_DATABASE: ${POSTGRES_DB:-temporalguard}
      DB_SCHEMA: ${DB_SCHEMA:-public}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dGVtcG9yYWxndWFyZC1sb2NhbC1rZXktbWF0ZXJpYWw=}
      QUEUE_PREFIX: ${QUEUE_PREFIX:-temporalguard}
      JOB_RETRY_ATTEMPTS: ${JOB_RETRY_ATTEMPTS:-5}
      JOB_STALLED_INTERVAL_MS: ${JOB_STALLED_INTERVAL_MS:-30000}
      INVESTIGATION_QUEUE_CONCURRENCY: ${INVESTIGATION_QUEUE_CONCURRENCY:-4}
      INVESTIGATION_MAX_CONCURRENT_PER_COMPANY: ${INVESTIGATION_MAX_CONCURRENT_PER_COMPANY:-3}
      WORKER_HEALTH_PORT: ${WORKER_HEALTH_PORT:-3002}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-access-secret-change-me}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local-refresh-secret-change-me}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      FRONTEND_ORIGIN: http://localhost:${GATEWAY_PORT:-8088}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-temporalguard/workspaces}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://ingester:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_EXPORTER_OTLP_COMPRESSION: ${OTEL_EXPORTER_OTLP_COMPRESSION:-gzip}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-otlp}
      SIGNOZ_MODE: ${SIGNOZ_MODE:-self_hosted}
      SIGNOZ_API_URL: http://temporalguard-signoz-signoz-0:8080
      SIGNOZ_UI_URL: ${SIGNOZ_PUBLIC_URL:-http://localhost:3301}
      SIGNOZ_API_KEY: ${SIGNOZ_API_KEY:-}
      SIGNOZ_QUERY_TIMEOUT_MS: ${SIGNOZ_QUERY_TIMEOUT_MS:-10000}
      SIGNOZ_QUERY_MAX_RANGE_HOURS: ${SIGNOZ_QUERY_MAX_RANGE_HOURS:-24}
      SIGNOZ_COMPARISON_MAX_RANGE_DAYS: ${SIGNOZ_COMPARISON_MAX_RANGE_DAYS:-30}
      SIGNOZ_QUERY_MAX_RETRIES: ${SIGNOZ_QUERY_MAX_RETRIES:-2}
      SIGNOZ_QUERY_CIRCUIT_BREAKER_THRESHOLD: ${SIGNOZ_QUERY_CIRCUIT_BREAKER_THRESHOLD:-5}
      SIGNOZ_QUERY_CIRCUIT_BREAKER_RESET_MS: ${SIGNOZ_QUERY_CIRCUIT_BREAKER_RESET_MS:-30000}
      SIGNOZ_QUERY_RATE_LIMIT_PER_MINUTE: ${SIGNOZ_QUERY_RATE_LIMIT_PER_MINUTE:-120}
      INVESTIGATION_AGENT_ENABLED: ${INVESTIGATION_AGENT_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-5.6-terra}
      AI_MAX_STEPS: ${AI_MAX_STEPS:-8}
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-30000}
      AI_MAX_INPUT_CHARS: ${AI_MAX_INPUT_CHARS:-60000}
      FEATURE_INVESTIGATIONS: ${FEATURE_INVESTIGATIONS:-true}
      FEATURE_COMPARISONS: ${FEATURE_COMPARISONS:-true}
      FEATURE_RULE_SIMULATION: ${FEATURE_RULE_SIMULATION:-true}
      FEATURE_DEPLOYMENT_ANALYSIS: ${FEATURE_DEPLOYMENT_ANALYSIS:-true}
      FEATURE_TELEMETRY_QUALITY: ${FEATURE_TELEMETRY_QUALITY:-true}
      FEATURE_SIGNOZ_ASSET_PROVISIONING: ${FEATURE_SIGNOZ_ASSET_PROVISIONING:-false}
      FEATURE_DEMO_SYSTEM: ${FEATURE_DEMO_SYSTEM:-true}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - temporalguard-app
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      <<: *a1
      OTEL_SERVICE_NAME: temporalguard-api
    expose:
      - "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      ingester:
        condition: service_started
    networks:
      - temporalguard-app
      - temporalguard-signoz-network
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://127.0.0.1:3000/api/health/ready
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      <<: *a1
      OTEL_SERVICE_NAME: temporalguard-worker
      WORKER_HEALTH_PORT: 3002
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      ingester:
        condition: service_started
    networks:
      - temporalguard-app
      - temporalguard-signoz-network
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://127.0.0.1:3002/health/ready
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
networks:
  temporalguard-signoz-network:
    name: temporalguard-signoz-network
  temporalguard-app:
    name: temporalguard-app
volumes:
  temporalguard-signoz-metastore-postgres-0-data:
    name: temporalguard-signoz-metastore-postgres-0-data
  temporalguard-signoz-telemetrykeeper-0-data:
    name: temporalguard-signoz-telemetrykeeper-0-data
  temporalguard-signoz-telemetrystore-0-0-data:
    name: temporalguard-signoz-telemetrystore-0-0-data
  temporalguard-signoz-telemetrystore-user-scripts:
    name: temporalguard-signoz-telemetrystore-user-scripts
  temporalguard-postgres-data: null
  temporalguard-redis-data: null
