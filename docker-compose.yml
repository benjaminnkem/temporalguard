services:
  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8080
      WEB_ORIGIN: http://web:3000
      API_ORIGIN: http://api:3000
      SIGNOZ_PUBLIC_URL: ${SIGNOZ_PUBLIC_URL:-http://localhost:3301}
    ports:
      - "${GATEWAY_PORT:-8088}:8080"
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    networks: [temporalguard-app]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: /api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    expose: ["3000"]
    networks: [temporalguard-app]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/overview"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-temporalguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-temporalguard}
      POSTGRES_DB: ${POSTGRES_DB:-temporalguard}
    volumes:
      - temporalguard-postgres-data:/var/lib/postgresql/data
    networks: [temporalguard-app]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - temporalguard-redis-data:/data
    networks: [temporalguard-app]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: "no"
    command:
      [
        "node",
        "node_modules/typeorm/cli.js",
        "-d",
        "dist/database/data-source.js",
        "migration:run",
      ]
    environment: &api-environment
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-temporalguard}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-temporalguard}
      DB_DATABASE: ${POSTGRES_DB:-temporalguard}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dGVtcG9yYWxndWFyZC1sb2NhbC1rZXktbWF0ZXJpYWw=}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-access-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local-refresh-secret-change-me}
      COOKIE_SECURE: "false"
      COOKIE_SAME_SITE: lax
      FRONTEND_ORIGIN: http://localhost:${GATEWAY_PORT:-8088}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://ingester:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      SIGNOZ_MODE: self_hosted
      SIGNOZ_API_URL: http://temporalguard-signoz-signoz-0:8080
      SIGNOZ_UI_URL: ${SIGNOZ_PUBLIC_URL:-http://localhost:3301}
      FEATURE_INVESTIGATIONS: "true"
      FEATURE_COMPARISONS: "true"
      FEATURE_RULE_SIMULATION: "true"
      FEATURE_DEPLOYMENT_ANALYSIS: "true"
      FEATURE_TELEMETRY_QUALITY: "true"
      FEATURE_DEMO_SYSTEM: "true"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [temporalguard-app]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      <<: *api-environment
      OTEL_SERVICE_NAME: temporalguard-api
    expose: ["3000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      ingester:
        condition: service_started
    networks:
      - temporalguard-app
      - temporalguard-signoz-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://127.0.0.1:3000/api/health/ready",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      <<: *api-environment
      OTEL_SERVICE_NAME: temporalguard-worker
      WORKER_HEALTH_PORT: 3002
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      ingester:
        condition: service_started
    networks:
      - temporalguard-app
      - temporalguard-signoz-network
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3002/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

networks:
  temporalguard-app:
    name: temporalguard-app
  temporalguard-signoz-network:
    name: temporalguard-signoz-network

volumes:
  temporalguard-postgres-data:
  temporalguard-redis-data:
