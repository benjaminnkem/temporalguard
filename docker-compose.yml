services:
  postgres:
    image: postgres:16-alpine
    container_name: temporalguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: temporalguard
    ports:
      - '5434:5432'
    volumes:
      - temporalguard_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d temporalguard']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: temporalguard-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - temporalguard_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  temporalguard_pg_data:
  temporalguard_redis_data:
